name: Build Open Ephys Plugin

on:
  push:
    tags:
      - "v*"
    paths:
      - "oe_plugin/**"
      - ".github/workflows/build.oe_plugin.yml"
  pull_request:
    paths:
      - "oe_plugin/**"
      - ".github/workflows/build.oe_plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            library: SpikeSpyStreamer.so
          - name: windows-x64
            os: windows-latest
            library: SpikeSpyStreamer.dll
          - name: macos-arm64
            os: macos-latest
            library: SpikeSpyStreamer.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Install ZeroMQ (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install ZeroMQ (macOS)
        if: runner.os == 'macOS'
        run: brew install zeromq

      - name: Install ZeroMQ (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: "& \"$env:VCPKG_INSTALLATION_ROOT\\vcpkg.exe\" install zeromq:x64-windows"

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          EXTRA_ARGS=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_ARGS="-DCMAKE_PREFIX_PATH=$(brew --prefix zeromq)"
          fi
          cmake -S oe_plugin -B build/oe_plugin -DCMAKE_BUILD_TYPE=Release $EXTRA_ARGS

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S oe_plugin -B build/oe_plugin `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build/oe_plugin --config Release

      - name: Stage artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp "build/oe_plugin/${{ matrix.library }}" staging/

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "build/oe_plugin/Release/SpikeSpyStreamer.dll" staging/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/zmq*.dll" staging/

      - uses: actions/upload-artifact@v4
        with:
          name: SpikeSpyStreamer-${{ matrix.name }}
          path: staging/
          if-no-files-found: error
